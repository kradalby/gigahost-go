name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every `run:` step executes inside `nix develop`, so tools come straight from
# the flake devShell with no per-step prefix.
defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  nix-build:
    name: nix build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia/action@main

      - name: Build gigahost CLI
        run: nix build --print-build-logs .#gigahost

      - name: Build terraform-provider-gigahost
        run: nix build --print-build-logs .#terraform-provider-gigahost
