# prek / pre-commit configuration.
# See https://prek.j178.dev/ and https://pre-commit.com/
#
# Hooks expect their tools to be resolvable from PATH. The nix dev
# shell (flake.nix#devShells.default) provides exactly the right
# versions; developers should enter it with `nix develop` (or use
# direnv). CI workflows wrap `prek run --all-files` with
# `nix develop --command` for the same effect.

exclude: (testdata/|^docs/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: prettier
        name: prettier
        entry: prettier --write --list-different
        language: system
        types_or: [yaml, json, markdown]

      - id: gofumpt
        name: gofumpt
        entry: gofumpt -w
        language: system
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout=5m --fix
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test -timeout=5m ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: nix-build-checks
        name: nix build (gated flake checks)
        entry: bash -c 'nix build --fallback .#checks.x86_64-linux.build .#checks.x86_64-linux.golangci-lint .#checks.x86_64-linux.formatting'
        language: system
        # rootVendorHash moves only with the module graph.
        files: ^(flake\.(nix|lock)|go\.(mod|sum))$
        pass_filenames: false
